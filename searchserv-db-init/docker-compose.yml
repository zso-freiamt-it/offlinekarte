services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  searchserv-loader:
    build:
      context: .
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      OUTPUT_DIR: /out
    volumes:
      - ./../searchserv/initdb.d:/out

