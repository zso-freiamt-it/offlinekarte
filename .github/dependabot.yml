version: 2
updates:
  # Example for Node.js / npm
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "mapserv-init/**"
      - "searchserv-db-init/**"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  # Example for keeping GitHub Actions up to date
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
